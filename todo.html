<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>My To-Do List</title> 
    <style>
       * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


body {
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;

font-family: Arial, Helvetica, sans-serif;

background: linear-gradient(
    135deg,
    #667eea,
    #764ba2
);


}

.todo-container {
width: 100%;
max-width: 550px;

background: #ffffff;
padding: 30px;

border-radius: 20px;

box-shadow:
    0 20px 50px rgba(0, 0, 0, 0.2);


}

/* Header */

.header {
text-align: center;
margin-bottom: 25px;
}

.header h1 {
color: #222;
font-size: 32px;
margin-bottom: 8px;
}

.header p {
color: #777;
font-size: 14px;
}

/* Input */

.input-box {
display: flex;
gap: 10px;
margin-bottom: 20px;
}

.input-box input {
flex: 1;

padding: 14px 16px;

border: 2px solid #e5e5e5;
border-radius: 10px;

outline: none;

font-size: 15px;

transition: 0.3s;


}

.input-box input:focus {
border-color: #667eea;
}

.input-box button {
padding: 0 20px;

border: none;
border-radius: 10px;

background: #667eea;
color: white;

font-size: 15px;
font-weight: bold;

cursor: pointer;

transition: 0.3s;


}

.input-box button:hover {
background: #5568d8;
transform: translateY(-1px);
}

/* Filters */

.filters {
display: flex;
gap: 8px;

margin-bottom: 20px;


}

.filter-btn {
flex: 1;

padding: 10px;

border: none;
border-radius: 8px;

background: #f1f1f1;
color: #555;

cursor: pointer;

font-size: 14px;

transition: 0.3s;


}

.filter-btn:hover {
background: #e5e5e5;
}

.filter-btn.active {
background: #667eea;
color: white;
}

/* Task List */

#taskList {
list-style: none;

display: flex;
flex-direction: column;
gap: 10px;

max-height: 350px;
overflow-y: auto;


}

/* Task */

.task-item {
display: flex;
align-items: center;
gap: 12px;

padding: 14px;

background: #f8f9ff;

border: 1px solid #eeeeee;
border-radius: 10px;

transition: 0.3s;


}

.task-item:hover {
transform: translateX(3px);
border-color: #d8dcff;
}

/* Checkbox */

.task-checkbox {
width: 20px;
height: 20px;

cursor: pointer;

accent-color: #667eea;


}

/* Task text */

.task-text {
flex: 1;

color: #333;

font-size: 15px;

word-break: break-word;


}

.task-item.completed .task-text {
color: #999;
text-decoration: line-through;
}

/* Delete button */

.delete-btn {
width: 32px;
height: 32px;

border: none;
border-radius: 8px;

background: #ffe8e8;
color: #e74c3c;

cursor: pointer;

font-size: 16px;

transition: 0.3s;


}

.delete-btn:hover {
background: #e74c3c;
color: white;
}

/* Empty message */

.empty-message {
text-align: center;
padding: 30px 10px;

color: #777;


}

.empty-icon {
font-size: 45px;
margin-bottom: 10px;
}

.empty-message h3 {
color: #444;
margin-bottom: 5px;
}

.empty-message p {
font-size: 14px;
}

/* Bottom info */

.task-info {
display: flex;
justify-content: space-between;
align-items: center;

margin-top: 20px;
padding-top: 15px;

border-top: 1px solid #eeeeee;


}

#taskCount {
color: #777;
font-size: 14px;
}

.clear-btn {
border: none;
background: transparent;

color: #e74c3c;

font-size: 14px;

cursor: pointer;


}

.clear-btn:hover {
text-decoration: underline;
}

/* Scrollbar */

#taskList::-webkit-scrollbar {
width: 6px;
}

#taskList::-webkit-scrollbar-thumb {
background: #c7c7c7;
border-radius: 10px;
}

/* Mobile */

@media (max-width: 500px) {

.todo-container {
    padding: 20px;
}

.header h1 {
    font-size: 27px;
}

.input-box {
    flex-direction: column;
}

.input-box button {
    padding: 13px;
}

.filters {
    flex-direction: column;
}

.task-info {
    flex-direction: column;
    gap: 10px;
}


}
    </style>
</head> <body>
<div class="todo-container">

    <div class="header">
        <h1>My To-Do List</h1>
        <p>Stay organized and get things done ✨</p>
    </div>

    <div class="input-box">
        <input
            type="text"
            id="taskInput"
            placeholder="Enter a task..."
            autocomplete="off"
        >
        <button onclick="addTask()">Add Task</button>
    </div>

    <div class="filters">
        <button class="filter-btn active" onclick="showAll()">All</button>
        <button class="filter-btn" onclick="showPending()">Pending</button>
        <button class="filter-btn" onclick="showCompleted()">Completed</button>
    </div>

    <ul id="taskList"></ul>

    <div class="empty-message" id="emptyMessage">
        <div class="empty-icon">📝</div>
        <h3>No tasks found</h3>
        <p>Add a new task to get started.</p>
    </div>

    <div class="task-info">
        <span id="taskCount">0 tasks</span>

        <button class="clear-btn" onclick="clearCompleted()">
            Clear Completed
        </button>
    </div>

</div>

<script>
    const taskInput = document.getElementById("taskInput");
const taskList = document.getElementById("taskList");
const taskCount = document.getElementById("taskCount");
const emptyMessage = document.getElementById("emptyMessage");

let tasks = [];
let currentFilter = "all";

// Add task
function addTask() {

const taskText = taskInput.value.trim();

if (taskText === "") {
    alert("Please enter a task!");
    return;
}

const task = {
    id: Date.now(),
    text: taskText,
    completed: false
};

tasks.push(task);

taskInput.value = "";

renderTasks();


}

// Enter key se task add hoga
taskInput.addEventListener("keydown", function(event) {

if (event.key === "Enter") {
    addTask();
}


});

// Render tasks
function renderTasks() {

taskList.innerHTML = "";

let filteredTasks = tasks;

if (currentFilter === "pending") {
    filteredTasks = tasks.filter(task => !task.completed);
}

if (currentFilter === "completed") {
    filteredTasks = tasks.filter(task => task.completed);
}

// Empty state
if (filteredTasks.length === 0) {
    emptyMessage.style.display = "block";
} else {
    emptyMessage.style.display = "none";
}


filteredTasks.forEach(task => {

    const li = document.createElement("li");

    li.className = "task-item";

    if (task.completed) {
        li.classList.add("completed");
    }


    li.innerHTML = `
        <input
            type="checkbox"
            class="task-checkbox"
            ${task.completed ? "checked" : ""}
            onchange="toggleTask(${task.id})"
        >

        <span class="task-text">
            ${escapeHTML(task.text)}
        </span>

        <button
            class="delete-btn"
            onclick="deleteTask(${task.id})"
            title="Delete task"
        >
            🗑
        </button>
    `;

    taskList.appendChild(li);
});


updateTaskCount();


}

// Complete / Undo task
function toggleTask(id) {

tasks = tasks.map(task => {

    if (task.id === id) {
        return {
            ...task,
            completed: !task.completed
        };
    }

    return task;
});

renderTasks();


}

// Delete task
function deleteTask(id) {

tasks = tasks.filter(task => task.id !== id);

renderTasks();


}

// Show all
function showAll() {

currentFilter = "all";

setActiveFilter(0);

renderTasks();


}

// Show pending
function showPending() {

currentFilter = "pending";

setActiveFilter(1);

renderTasks();


}

// Show completed
function showCompleted() {

currentFilter = "completed";

setActiveFilter(2);

renderTasks();


}

// Active filter button
function setActiveFilter(index) {

const buttons = document.querySelectorAll(".filter-btn");

buttons.forEach(button => {
    button.classList.remove("active");
});

buttons[index].classList.add("active");


}

// Clear completed tasks
function clearCompleted() {

tasks = tasks.filter(task => !task.completed);

renderTasks();


}

// Update task counter
function updateTaskCount() {

const pendingTasks = tasks.filter(task => !task.completed).length;

if (pendingTasks === 1) {
    taskCount.textContent = "1 task remaining";
} else {
    taskCount.textContent = `${pendingTasks} tasks remaining`;
}


}

// Prevent HTML injection
function escapeHTML(text) {

const div = document.createElement("div");

div.textContent = text;

return div.innerHTML;


}

// Initial render
renderTasks();
</script>

</body> </html>
